<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - Notifications Broadcast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div id="app-layout-root">
        <div class="view-header">
            <div class="view-title">
                <h1>Communications & Alerts</h1>
                <p>Broadcast email/SMS alerts to patients, view delivery status logs, and configure triggers.</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 3fr; gap: 32px;" class="form-row">
            <!-- Composer Card -->
            <div class="card" style="height: fit-content;">
                <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;"><i class="fas fa-paper-plane text-primary"></i> Compose Announcement</h2>
                <form id="notification-compose-form">
                    <!-- Target User Selection -->
                    <div class="form-group">
                        <label class="required" for="notify-user-select">Target Patient Profile</label>
                        <select id="notify-user-select" class="form-control" required>
                            <option value="" disabled selected>Select Recipient</option>
                        </select>
                    </div>

                    <!-- Notification Type -->
                    <div class="form-group">
                        <label class="required" for="notify-type">Delivery Channel</label>
                        <select id="notify-type" class="form-control" required>
                            <option value="EMAIL">Email Delivery Service</option>
                            <option value="SMS">SMS Message Gateway</option>
                            <option value="IN_APP">In-App Portal Notification</option>
                        </select>
                    </div>

                    <!-- Subject (Visible for Email) -->
                    <div class="form-group" id="notify-subject-group">
                        <label class="required" for="notify-subject">Subject Line</label>
                        <input type="text" id="notify-subject" class="form-control" placeholder="Appointment Reminder / Health Alert">
                    </div>

                    <!-- Contact Overrides (Auto filled from Patient) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="notify-email-override">Email Address</label>
                            <input type="email" id="notify-email-override" class="form-control" placeholder="patient@example.com" readonly>
                        </div>
                        <div class="form-group">
                            <label for="notify-phone-override">Phone Number</label>
                            <input type="text" id="notify-phone-override" class="form-control" placeholder="+1-555-555-5555" readonly>
                        </div>
                    </div>

                    <!-- Message Body -->
                    <div class="form-group">
                        <label class="required" for="notify-message">Announcement Message Body</label>
                        <textarea id="notify-message" class="form-control" rows="4" placeholder="Type your alert details here..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" style="margin-top: 10px;">
                        <i class="fas fa-share-square"></i> Dispatch Notification
                    </button>
                </form>
            </div>

            <!-- Historical Log Table Card -->
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="font-size: 1.1rem; font-weight: 700;"><i class="fas fa-history text-muted"></i> Communication Logs</h2>
                    <select id="log-status-filter" class="form-control" style="width:150px; padding:6px 12px; font-size:0.85rem;">
                        <option value="">All Statuses</option>
                        <option value="SENT">Sent</option>
                        <option value="PENDING">Pending</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table class="custom-table" style="font-size: 0.85rem;">
                        <thead>
                            <tr>
                                <th>Channel</th>
                                <th>Recipient Info</th>
                                <th>Message Details</th>
                                <th>Delivery Status</th>
                            </tr>
                        </thead>
                        <tbody id="notifications-table-body">
                            <tr>
                                <td colspan="4" class="text-center"><div class="spinner" style="margin: 20px auto;"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
