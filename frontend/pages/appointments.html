<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - Appointments Scheduler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div id="app-layout-root">
        <div class="view-header">
            <div class="view-title">
                <h1>Hospital Appointments</h1>
                <p>Register schedules, select departments, check statuses, and manage hours.</p>
            </div>
            <div class="view-actions">
                <button class="btn btn-primary" id="btn-open-book-modal"><i class="fas fa-calendar-plus"></i> Book Appointment</button>
            </div>
        </div>

        <!-- Filters section -->
        <div class="card" style="margin-bottom: 24px;">
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px;" class="form-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label for="filter-search-name">Search by Patient/Doctor</label>
                    <input type="text" id="filter-search-name" class="form-control" placeholder="Search names...">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="filter-status-select">Status Filter</label>
                    <select id="filter-status-select" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                        <option value="RESCHEDULED">Rescheduled</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0; display:flex; align-items:flex-end;">
                    <button class="btn btn-secondary w-100" id="btn-clear-filters"><i class="fas fa-undo"></i> Reset Filters</button>
                </div>
            </div>
        </div>

        <!-- Appointments Table list -->
        <div class="card">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient Name</th>
                            <th>Doctor / Department</th>
                            <th>Appointment Date & Time</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-table-body">
                        <tr>
                            <td colspan="7" class="text-center"><div class="spinner" style="margin: 20px auto;"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Book/Reschedule Appointment Modal -->
        <div class="modal-overlay" id="appointment-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-appointment-title">Schedule Appointment</h2>
                    <button class="modal-close" onclick="closeModal('appointment-modal')">&times;</button>
                </div>
                <form id="appointment-form">
                    <input type="hidden" id="app-edit-id">
                    <div class="modal-body">
                        <!-- Patient Select Group (Hidden for patient users) -->
                        <div class="form-group" id="app-patient-group">
                            <label class="required" for="app-patient-select">Patient Profile</label>
                            <select id="app-patient-select" class="form-control">
                                <option value="" disabled selected>Select Patient</option>
                            </select>
                        </div>

                        <!-- Department Select -->
                        <div class="form-group">
                            <label class="required" for="app-dept-select">Department</label>
                            <select id="app-dept-select" class="form-control" required>
                                <option value="" disabled selected>Select Department</option>
                            </select>
                        </div>

                        <!-- Doctor Select -->
                        <div class="form-group">
                            <label class="required" for="app-doc-select">Assigned Doctor</label>
                            <select id="app-doc-select" class="form-control" required>
                                <option value="" disabled selected>Select Practitioner</option>
                            </select>
                        </div>

                        <!-- Date Time Picker -->
                        <div class="form-group">
                            <label class="required" for="app-date">Date & Time of Consultation</label>
                            <input type="datetime-local" id="app-date" class="form-control" required>
                        </div>

                        <!-- Reason -->
                        <div class="form-group">
                            <label class="required" for="app-reason">Reason for Visit</label>
                            <input type="text" id="app-reason" class="form-control" placeholder="Routine general health checkup" required>
                        </div>

                        <!-- Notes -->
                        <div class="form-group">
                            <label for="app-notes">Special Notes / Warnings</label>
                            <textarea id="app-notes" class="form-control" rows="3" placeholder="Blood pressure, headaches, follow-up, etc."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('appointment-modal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Appointment Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/appointments.js"></script>
</body>
</html>
